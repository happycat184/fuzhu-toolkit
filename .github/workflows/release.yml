name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.1'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set Maven project version
        run: mvn --batch-mode --no-transfer-progress versions:set -DnewVersion=${{ steps.release.outputs.version }} -DgenerateBackupPoms=false

      - name: Build release JAR
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Prepare release asset
        shell: bash
        run: |
          JAR=$(find target -maxdepth 1 -type f -name 'fuzhu-toolkit-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)
          test -n "$JAR"
          cp "$JAR" "target/fuzhu-toolkit-${{ steps.release.outputs.tag }}.jar"

      - name: Create GitHub Release and upload JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            "target/fuzhu-toolkit-${{ steps.release.outputs.tag }}.jar" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "FuzhuToolkit ${{ steps.release.outputs.tag }}" \
            --generate-notes \
            --verify-tag
